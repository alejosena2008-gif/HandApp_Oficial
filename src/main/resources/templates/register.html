<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HandApp – Crear Cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" th:href="@{/IMG/manos.png}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0b0d14; --surface:#13151f; --card:#1a1d2b; --border:#272a3d;
      --accent:#6c63ff; --accent2:#8b84ff; --text:#e8eaf6; --muted:#7880a0;
      --error:#e05252; --success:#3ecf8e;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 20px; position:relative; overflow-x:hidden; }
    body::before { content:''; position:fixed; top:-200px; left:-200px; width:600px; height:600px; background:radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%); pointer-events:none; }
    body::after { content:''; position:fixed; bottom:-200px; right:-200px; width:500px; height:500px; background:radial-gradient(circle, rgba(139,132,255,0.08) 0%, transparent 70%); pointer-events:none; }
    .register-wrapper { width:100%; max-width:460px; position:relative; z-index:1; }
    .logo-link { display:flex; align-items:center; gap:10px; text-decoration:none; margin-bottom:32px; justify-content:center; }
    .logo-icon { width:40px; height:40px; background:var(--accent); border-radius:10px; display:flex; align-items:center; justify-content:center; }
    .logo-icon svg { width:22px; height:22px; color:#fff; }
    .logo-name { font-size:1.4rem; font-weight:800; color:var(--text); letter-spacing:-0.5px; }
    .logo-name span { color:var(--accent2); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:36px 32px; box-shadow:0 24px 60px rgba(0,0,0,0.4); }
    .card-title { font-size:1.5rem; font-weight:700; margin-bottom:6px; }
    .card-sub { color:var(--muted); font-size:0.9rem; margin-bottom:28px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:0.78rem; font-weight:600; color:var(--muted); margin-bottom:7px; text-transform:uppercase; letter-spacing:.5px; }
    .input-wrap { position:relative; }
    .input-wrap > svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); pointer-events:none; }
    .form-group input { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:12px 14px 12px 42px; border-radius:10px; font-size:0.9rem; font-family:inherit; outline:none; transition:border-color .2s, box-shadow .2s; }
    .form-group input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,99,255,0.15); }
    .form-group input.invalid { border-color:var(--error); }
    .form-group input::placeholder { color:var(--muted); }
    .field-error { font-size:0.78rem; color:var(--error); margin-top:5px; display:none; }
    .field-error.show { display:block; }
    .toggle-pass { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; display:flex; }
    .toggle-pass:hover { color:var(--text); }
    .toggle-pass svg { width:16px; height:16px; }
    .strength-bar { height:3px; border-radius:2px; margin-top:6px; background:var(--border); overflow:hidden; }
    .strength-fill { height:100%; border-radius:2px; transition:width .3s, background .3s; width:0%; }
    .strength-label { font-size:0.73rem; color:var(--muted); margin-top:4px; }
    .check-group { margin-bottom:20px; }
    .check-label { display:flex; align-items:flex-start; gap:10px; cursor:pointer; font-size:0.85rem; color:var(--muted); }
    .check-label input[type="checkbox"] { display:none; }
    .check-box { width:18px; height:18px; flex-shrink:0; border:2px solid var(--border); border-radius:5px; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .2s; background:var(--surface); }
    .check-label input:checked + .check-box { background:var(--accent); border-color:var(--accent); }
    .check-box svg { width:11px; height:11px; color:#fff; display:none; }
    .check-label input:checked + .check-box svg { display:block; }
    .check-label a { color:var(--accent2); text-decoration:none; }
    .check-label a:hover { text-decoration:underline; }
    .alert { padding:12px 16px; border-radius:10px; font-size:0.85rem; margin-bottom:16px; display:none; align-items:center; gap:10px; }
    .alert.show { display:flex; }
    .alert.err { background:rgba(224,82,82,0.1); border:1px solid rgba(224,82,82,0.3); color:var(--error); }
    .btn-primary { width:100%; background:var(--accent); color:#fff; border:none; padding:14px; border-radius:10px; font-size:1rem; font-weight:600; font-family:inherit; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-primary:hover { background:var(--accent2); transform:translateY(-1px); }
    .divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--muted); font-size:0.8rem; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .form-footer { text-align:center; font-size:0.88rem; color:var(--muted); }
    .form-footer a { color:var(--accent2); text-decoration:none; font-weight:600; }
    .form-footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>

<div class="register-wrapper">
  <a class="logo-link" th:href="@{/}">
    <div class="logo-icon">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4C28.686 4 26 6.686 26 10V30H22V16C22 12.686 19.314 10 16 10C12.686 10 10 12.686 10 16V38C10 50.15 19.85 60 32 60C44.15 60 54 50.15 54 38V22C54 18.686 51.314 16 48 16C44.686 16 42 18.686 42 22V30H38V10C38 6.686 35.314 4 32 4Z" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="logo-name">Hand<span>App</span></span>
  </a>

  <div class="card">
    <h1 class="card-title">Crear cuenta</h1>
    <p class="card-sub">Únete y empieza a aprender lenguaje de señas</p>

    <div class="alert err show" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${registroDTO}" method="post" id="registerForm">

      <div class="form-group">
        <label>Nombre completo</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" th:field="*{nombre}" placeholder="Tu nombre" required>
        </div>
        <div class="field-error" id="err-nombre">Ingresa tu nombre.</div>
      </div>

      <div class="form-group">
        <label>Correo electrónico</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" th:field="*{correo}" placeholder="tu@correo.com" required>
        </div>
        <div class="field-error" id="err-correo">Ingresa un correo válido.</div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input type="password" th:field="*{contrasena}" id="contrasena" placeholder="Mínimo 6 caracteres" oninput="checkStrength(this.value)" required>
          <button class="toggle-pass" type="button" onclick="togglePass('contrasena', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
        <div class="field-error" id="err-contrasena">Mínimo 6 caracteres.</div>
      </div>

      <div class="form-group">
        <label>Confirmar contraseña</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input type="password" th:field="*{confirmarContrasena}" id="confirmarContrasena" placeholder="Repite la contraseña" required>
          <button class="toggle-pass" type="button" onclick="togglePass('confirmarContrasena', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="field-error" id="err-confirmarContrasena">Las contraseñas no coinciden.</div>
      </div>

      <div class="check-group">
        <label class="check-label">
          <input type="checkbox" id="terminos">
          <span class="check-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20,6 9,17 4,12"/>
            </svg>
          </span>
          <span>Acepto los <a href="#">Términos y Condiciones</a></span>
        </label>
        <div class="field-error" id="err-terminos">Debes aceptar los términos.</div>
      </div>

      <button class="btn-primary" type="submit">
        <span>Crear mi cuenta</span>
      </button>
    </form>

    <div class="divider">¿Ya tienes cuenta?</div>

    <div class="form-footer">
      <a th:href="@{/login}">Iniciar sesión</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', function (e) {
    const nombre = document.querySelector('[name=nombre]').value.trim();
    const correo = document.querySelector('[name=correo]').value.trim();
    const contrasena = document.getElementById('contrasena').value;
    const confirmar = document.getElementById('confirmarContrasena').value;
    const terminos = document.getElementById('terminos').checked;

    ['nombre','correo','contrasena','confirmarContrasena','terminos'].forEach(f => {
      const err = document.getElementById('err-' + f);
      if (err) err.classList.remove('show');
    });

    let ok = true;
    if (!nombre) { show('err-nombre'); ok = false; }
    if (!correo || !correo.includes('@')) { show('err-correo'); ok = false; }
    if (contrasena.length < 6) { show('err-contrasena'); ok = false; }
    if (contrasena !== confirmar) { show('err-confirmarContrasena'); ok = false; }
    if (!terminos) { show('err-terminos'); ok = false; }

    if (!ok) e.preventDefault();
  });

  function show(id) { document.getElementById(id).classList.add('show'); }

  function togglePass(id, btn) {
    const inp = document.getElementById(id);
    const visible = inp.type === 'text';
    inp.type = visible ? 'password' : 'text';
    btn.querySelector('svg').innerHTML = visible
      ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`
      : `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
         <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
         <line x1="1" y1="1" x2="23" y2="23"/>`;
  }

  function checkStrength(pass) {
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    if (!pass) { fill.style.width = '0%'; label.textContent = ''; return; }
    let score = 0;
    if (pass.length >= 6) score++;
    if (pass.length >= 10) score++;
    if (/[A-Z]/.test(pass)) score++;
    if (/[0-9]/.test(pass)) score++;
    if (/[^A-Za-z0-9]/.test(pass)) score++;
    const niveles = [
      { w:'20%', color:'#e05252', txt:'Muy débil' },
      { w:'40%', color:'#f0a845', txt:'Débil' },
      { w:'60%', color:'#f0a845', txt:'Regular' },
      { w:'80%', color:'#3ecf8e', txt:'Fuerte' },
      { w:'100%',color:'#3ecf8e', txt:'Muy fuerte' },
    ];
    const n = niveles[Math.min(score - 1, 4)] || niveles[0];
    fill.style.width = n.w; fill.style.background = n.color;
    label.textContent = n.txt; label.style.color = n.color;
  }
</script>
</body>
</html>
